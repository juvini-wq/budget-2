<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Budget and Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8f9fc;
            --bg-card: #ffffff;
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent-purple: #7c3aed;
            --accent-purple-light: rgba(124, 58, 237, 0.08);
            --accent-green: #059669;
            --accent-green-bg: rgba(5, 150, 105, 0.1);
            --accent-red: #dc2626;
            --accent-red-bg: rgba(220, 38, 38, 0.1);
            --input-bg: #f3f4f6;
            --input-border: #e5e7eb;
            --nav-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-main: #131722;
            --bg-card: #1c2230;
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f3f8;
            --text-muted: #8e9bb0;
            --accent-purple: #8b72de;
            --accent-purple-light: rgba(139, 114, 222, 0.15);
            --accent-green: #71b898;
            --accent-green-bg: rgba(113, 184, 152, 0.15);
            --accent-red: #d97d75;
            --accent-red-bg: rgba(217, 125, 117, 0.15);
            --input-bg: #151a26;
            --input-border: rgba(255, 255, 255, 0.15);
            --nav-bg: #131722;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .serif {
            font-family: 'Instrument Serif', Georgia, serif;
        }

        .header {
            padding: 24px 20px 12px 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .brand-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--accent-purple);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .brand-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .date-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .action-btn-primary {
            width: 100%;
            background: var(--accent-purple);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .view-section.active-view {
            display: flex;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            width: 100%;
        }

        .card-large {
            padding: 26px;
        }

        .card-tag {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-purple);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-tag::before {
            content: "•";
            font-size: 14px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .upcoming-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .upcoming-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--input-bg);
            border-radius: 14px;
            border: 1px solid var(--input-border);
        }

        .upcoming-info h4 {
            font-size: 14px;
            font-weight: 600;
        }

        .upcoming-info span {
            font-size: 12px;
            color: var(--text-muted);
        }
