<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vicky's Planner</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #f2f4f8;
        --line: #e6eaf1;
        --text: #18212f;
        --text-soft: #697585;
        --purple: #8b5cf6;
        --purple-soft: rgba(139, 92, 246, 0.12);
        --green: #1bb77c;
        --green-soft: rgba(27, 183, 124, 0.12);
        --red: #f05d5e;
        --red-soft: rgba(240, 93, 94, 0.12);
        --yellow: #f8b84e;
        --yellow-soft: rgba(248, 184, 78, 0.12);
        --blue: #4e7cff;
        --blue-soft: rgba(78, 124, 255, 0.1);
        --shadow: 0 12px 32px rgba(24, 33, 47, 0.08);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding-bottom: 92px;
      }

      button, input, select {
        font: inherit;
      }

      .app {
        max-width: 540px;
        margin: 0 auto;
        padding: 20px 18px 32px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .title-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-soft);
        font-weight: 700;
      }

      .month {
        font-size: clamp(2.1rem, 7vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 14px;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 22px 20px;
        background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(78,124,255,0.04));
      }

      .hero-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .balance-label {
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .balance-amount {
        font-size: clamp(2.1rem, 7vw, 3.1rem);
        font-weight: 700;
        letter-spacing: -0.07em;
        margin-top: 6px;
      }

      .mini-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .summary-box {
        padding: 16px 14px;
        border-radius: 18px;
        border: 1px solid var(--line);
      }

      .summary-box.income {
        background: var(--green-soft);
      }

      .summary-box.expense {
        background: var(--red-soft);
      }

      .summary-box.left {
        background: var(--purple-soft);
      }

      .summary-box.saved {
        background: var(--blue-soft);
      }

      .summary-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-soft);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .summary-value {
        margin-top: 10px;
        font-size: clamp(1.4rem, 6vw, 1.9rem);
        letter-spacing: -0.05em;
        font-weight: 700;
      }

      .section {
        margin-top: 18px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 4px 12px;
      }

      .section-title {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .text-link {
        border: none;
        background: none;
        color: var(--purple);
        font-weight: 700;
        cursor: pointer;
        padding: 0;
      }

      .quick-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .quick-btn {
        flex: 1;
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel-soft);
        cursor: pointer;
        font-weight: 600;
        color: var(--text);
      }

      .quick-btn.active {
        background: var(--purple-soft);
        color: var(--purple);
        border-color: rgba(139, 92, 246, 0.3);
      }

      .form-panel {
        padding: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      input, select {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        border-radius: 12px;
        padding: 12px 13px;
        color: var(--text);
        outline: none;
      }

      input:focus, select:focus {
        border-color: rgba(139, 92, 246, 0.5);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
      }

      .primary-btn {
        margin-top: 16px;
        width: 100%;
        border: none;
        background: linear-gradient(135deg, var(--purple), #a855f7);
        color: white;
        padding: 15px 18px;
        border-radius: 14px;
        font-weight: 700;
        letter-spacing: -0.02em;
        cursor: pointer;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .transaction {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .txn-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .txn-icon.income {
        background: var(--green-soft);
        color: var(--green);
      }

      .txn-icon.expense {
        background: var(--red-soft);
        color: var(--red);
      }

      .txn-main {
        min-width: 0;
      }

      .txn-name {
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .txn-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-soft);
      }

      .txn-amount {
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .txn-amount.income {
        color: var(--green);
      }

      .txn-amount.expense {
        color: var(--red);
      }

      .budget-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .budget-item {
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .budget-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .budget-name {
        font-weight: 700;
      }

      .budget-meta {
        color: var(--text-soft);
        font-size: 12px;
      }

      .progress {
        width: 100%;
        height: 10px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--purple), #c084fc);
      }

      .progress-bar.warning {
        background: linear-gradient(90deg, var(--yellow), #fbbf24);
      }

      .progress-bar.danger {
        background: linear-gradient(90deg, var(--red), #fb7185);
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(540px, calc(100% - 24px));
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 10px 8px;
        gap: 8px;
      }

      .nav-item {
        border: none;
        background: transparent;
        color: var(--text-soft);
        padding: 8px 6px 6px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
      }

      .nav-item.active {
        color: var(--purple);
        background: var(--purple-soft);
      }

      .empty {
        padding: 28px 18px;
        text-align: center;
        color: var(--text-soft);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      @media (max-width: 420px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .summary-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-stack">
          <div class="eyebrow">Budget</div>
          <div class="month" id="monthLabel">September</div>
        </div>
        <button class="icon-btn" aria-label="Settings">⚙️</button>
      </header>

      <section class="card hero">
        <div class="hero-row">
          <div>
            <div class="balance-label">Available</div>
            <div class="balance-amount" id="balanceAmount">$0.00</div>
          </div>
          <div class="mini-pill">+ $0 this month</div>
        </div>

        <div class="summary-grid">
          <div class="summary-box income">
            <div class="summary-head">
              <span>Income</span>
              <span>↗</span>
            </div>
            <div class="summary-value" id="incomeValue">$0.00</div>
          </div>

          <div class="summary-box expense">
            <div class="summary-head">
              <span>Spent</span>
              <span>↘</span>
            </div>
            <div class="summary-value" id="expenseValue">$0.00</div>
          </div>

          <div class="summary-box left">
            <div class="summary-head">
              <span>Left</span>
              <span>◌</span>
            </div>
            <div class="summary-value" id="leftValue">$0.00</div>
          </div>

          <div class="summary-box saved">
            <div class="summary-head">
              <span>Saved</span>
              <span>◎</span>
            </div>
            <div class="summary-value" id="savedValue">$0.00</div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <div class="section-title">Quick add</div>
        </div>

        <div class="card form-panel">
          <div class="quick-actions">
            <button class="quick-btn active" data-type="expense">Expense</button>
            <button class="quick-btn" data-type="income">Income</button>
          </div>

          <div class="form-grid" style="margin-top: 16px;">
            <div class="field full">
              <label for="txnName">Title</label>
              <input id="txnName" type="text" placeholder="Groceries, salary, rent..." />
            </div>

            <div class="field">
              <label for="txnAmount">Amount</label>
              <input id="txnAmount" type="number" min="0" step="0.01" placeholder="0.00" />
            </div>

            <div class="field">
              <label for="txnCategory">Category</label>
              <select id="txnCategory">
                <option value="Housing">Housing</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Savings">Savings</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <button class="primary-btn" id="addTransactionBtn">Add transaction</button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <div class="section-title">Recent activity</div>
          <button class="text-link" id="clearAllBtn">Clear all</button>
        </div>

        <div id="transactionsContainer" class="list"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <div class="section-title">Budget overview</div>
        </div>

        <div id="budgetList" class="budget-list"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active">🏠<span>Home</span></button>
      <button class="nav-item">📊<span>Stats</span></button>
      <button class="nav-item">🧾<span>Bills</span></button>
      <button class="nav-item">⚑<span>Goals</span></button>
    </nav>

    <script>
      const storageKey = 'vickys-planner-transactions';
      const budgetTargets = {
        Housing: 1200,
        Food: 520,
        Transport: 220,
        Bills: 350,
        Entertainment: 260,
        Health: 180,
        Savings: 450,
        Other: 200
      };

      const defaultTransactions = [
        { id: 1, name: 'Paycheck', type: 'income', amount: 2800, category: 'Income', date: new Date().toISOString() },
        { id: 2, name: 'Rent', type: 'expense', amount: 1200, category: 'Housing', date: new Date().toISOString() },
        { id: 3, name: 'Groceries', type: 'expense', amount: 170, category: 'Food', date: new Date().toISOString() },
        { id: 4, name: 'Streaming', type: 'expense', amount: 18, category: 'Entertainment', date: new Date().toISOString() }
      ];

      const state = {
        currentType: 'expense',
        transactions: loadTransactions()
      };

      const monthLabel = document.getElementById('monthLabel');
      const balanceAmount = document.getElementById('balanceAmount');
      const incomeValue = document.getElementById('incomeValue');
      const expenseValue = document.getElementById('expenseValue');
      const leftValue = document.getElementById('leftValue');
      const savedValue = document.getElementById('savedValue');
      const transactionsContainer = document.getElementById('transactionsContainer');
      const budgetList = document.getElementById('budgetList');
      const txnNameInput = document.getElementById('txnName');
      const txnAmountInput = document.getElementById('txnAmount');
      const txnCategorySelect = document.getElementById('txnCategory');

      function loadTransactions() {
        try {
          const raw = localStorage.getItem(storageKey);
          if (!raw) return defaultTransactions;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length ? parsed : defaultTransactions;
        } catch {
          return defaultTransactions;
        }
      }

      function saveTransactions() {
        localStorage.setItem(storageKey, JSON.stringify(state.transactions));
      }

      function currency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2
        }).format(value);
      }

      function setMonthLabel() {
        const now = new Date();
        monthLabel.textContent = now.toLocaleString('en-US', { month: 'long' });
      }

      function getTotals() {
        const income = state.transactions
          .filter(item => item.type === 'income')
          .reduce((sum, item) => sum + Number(item.amount), 0);

        const expenses = state.transactions
          .filter(item => item.type === 'expense')
          .reduce((sum, item) => sum + Number(item.amount), 0);

        const left = income - expenses;
        const saved = Math.max(left, 0);

        return { income, expenses, left, saved };
      }

      function renderSummary() {
        const { income, expenses, left, saved } = getTotals();
        incomeValue.textContent = currency(income);
        expenseValue.textContent = currency(expenses);
        leftValue.textContent = currency(left);
        savedValue.textContent = currency(saved);
        balanceAmount.textContent = currency(left);
      }

      function renderTransactions() {
        if (!state.transactions.length) {
          transactionsContainer.innerHTML = '<div class="empty">No transactions yet. Add your first one above.</div>';
          return;
        }

        const items = [...state.transactions]
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .slice(0, 8);

        transactionsContainer.innerHTML = items.map(item => {
          const sign = item.type === 'income' ? '+' : '-';
          return `
            <div class="transaction">
              <div class="txn-icon ${item.type}">${item.type === 'income' ? '↑' : '↓'}</div>
              <div class="txn-main">
                <div class="txn-name">${escapeHtml(item.name)}</div>
                <div class="txn-meta">${escapeHtml(item.category)} • ${new Date(item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
              </div>
              <div class="txn-amount ${item.type}">${sign}${currency(Number(item.amount))}</div>
            </div>
          `;
        }).join('');
      }

      function renderBudgetOverview() {
        const entries = Object.entries(budgetTargets).map(([category, target]) => {
          const spent = state.transactions
            .filter(item => item.type === 'expense' && item.category === category)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const pct = Math.min((spent / target) * 100, 100);
          const level = pct >= 85 ? 'danger' : pct >= 70 ? 'warning' : '';

          return {
            category,
            target,
            spent,
            pct,
            level
          };
        });

        budgetList.innerHTML = entries.map(item => `
          <div class="budget-item">
            <div class="budget-head">
              <div>
                <div class="budget-name">${item.category}</div>
                <div class="budget-meta">${currency(item.spent)} of ${currency(item.target)}</div>
              </div>
              <div class="budget-meta">${Math.round(item.pct)}%</div>
            </div>
            <div class="progress">
              <div class="progress-bar ${item.level}" style="width: ${Math.min(item.pct, 100)}%"></div>
            </div>
          </div>
        `).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function addTransaction() {
        const name = txnNameInput.value.trim();
        const amount = Number(txnAmountInput.value);
        const category = txnCategorySelect.value;

        if (!name || !amount || amount <= 0) {
          alert('Please enter a valid title and amount.');
          return;
        }

        const transaction = {
          id: Date.now(),
          name,
          type: state.currentType,
          amount,
          category: state.currentType === 'income' ? 'Income' : category,
          date: new Date().toISOString()
        };

        state.transactions.push(transaction);
        saveTransactions();
        renderAll();

        txnNameInput.value = '';
        txnAmountInput.value = '';
        txnCategorySelect.value = 'Housing';
      }

      function renderAll() {
        setMonthLabel();
        renderSummary();
        renderTransactions();
        renderBudgetOverview();
      }

      document.querySelectorAll('.quick-btn').forEach(button => {
        button.addEventListener('click', () => {
          state.currentType = button.dataset.type;
          document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.toggle('active', btn === button));
        });
      });

      document.getElementById('addTransactionBtn').addEventListener('click', addTransaction);
      document.getElementById('clearAllBtn').addEventListener('click', () => {
        const confirmed = confirm('Clear all saved transactions?');
        if (!confirmed) return;

        state.transactions = [];
        saveTransactions();
        renderAll();
      });

      renderAll();
    </script>
  </body>
</html>
